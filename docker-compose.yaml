name: smart-plant-monitoring

# VPS / Cloud Processing Layer for the IoT Smart Plant Monitoring system.
# Services: MQTT broker, Bruin data processing (DuckDB staging),
# ETL uploader to BigQuery, and a Streamlit dashboard.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  plant-net:
    driver: bridge

volumes:
  mosquitto-data:
  mosquitto-log:
  duckdb-data:

services:
  # ---------------------------------------------------------------------------
  # MQTT Broker (Mosquitto)
  # Receives sensor data and prediction results from the Raspberry Pi edge node
  # and distributes messages between services.
  # ---------------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: spm-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # MQTT over WebSockets
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - plant-net
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -W 3 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # MQTT -> DuckDB ingestion service
  # Subscribes to sensor / prediction topics and writes raw events into the
  # DuckDB staging database used by Bruin.
  # ---------------------------------------------------------------------------
  ingestor:
    image: python:3.11-slim
    container_name: spm-ingestor
    restart: unless-stopped
    working_dir: /app
    depends_on:
      mosquitto:
        condition: service_started
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_TOPICS: "plants/+/sensors,plants/+/predictions"
      DUCKDB_PATH: /data/duckdb.db
    volumes:
      - ./ingestor:/app
      - duckdb-data:/data
      - ./bruin/duckdb.db:/data/duckdb.db
    command: >
      sh -c "pip install --no-cache-dir paho-mqtt duckdb &&
             python /app/ingestor.py"
    networks:
      - plant-net
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Bruin data processing
  # Runs the pipeline defined under ./bruin (data cleaning, transformation,
  # feature engineering, aggregation, curated dataset preparation).
  # ---------------------------------------------------------------------------
  bruin:
    image: ghcr.io/bruin-data/bruin:latest
    container_name: spm-bruin
    restart: "no"
    working_dir: /workspace
    volumes:
      - ./bruin:/workspace
      - duckdb-data:/data
    environment:
      BRUIN_HOME: /workspace
    entrypoint: ["bruin"]
    command: ["run", "."]
    depends_on:
      - ingestor
    networks:
      - plant-net
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # ETL / Upload Service
  # Extracts curated data from DuckDB and incrementally loads it into BigQuery.
  # Expects a Google service account JSON mounted at /secrets/gcp-sa.json.
  # ---------------------------------------------------------------------------
  etl:
    image: python:3.11-slim
    container_name: spm-etl
    restart: unless-stopped
    working_dir: /app
    environment:
      DUCKDB_PATH: /data/duckdb.db
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-sa.json
      BQ_PROJECT_ID: ${BQ_PROJECT_ID:-your-gcp-project}
      BQ_DATASET: ${BQ_DATASET:-smart_plant}
      UPLOAD_INTERVAL_SECONDS: "300"
    volumes:
      - ./etl:/app
      - duckdb-data:/data
      - ./secrets:/secrets:ro
    command: >
      sh -c "pip install --no-cache-dir duckdb google-cloud-bigquery pandas pyarrow &&
             python /app/uploader.py"
    depends_on:
      - bruin
    networks:
      - plant-net
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Streamlit Dashboard
  # Real-time monitoring, plant condition visualization, and prediction
  # insights. Reads from BigQuery (and optionally DuckDB for local views).
  # ---------------------------------------------------------------------------
  dashboard:
    image: python:3.11-slim
    container_name: spm-dashboard
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8501:8501"
    environment:
      DUCKDB_PATH: /data/duckdb.db
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-sa.json
      BQ_PROJECT_ID: ${BQ_PROJECT_ID:-your-gcp-project}
      BQ_DATASET: ${BQ_DATASET:-smart_plant}
    volumes:
      - ./dashboard:/app
      - duckdb-data:/data
      - ./secrets:/secrets:ro
    command: >
      sh -c "pip install --no-cache-dir streamlit duckdb pandas google-cloud-bigquery pyarrow &&
             streamlit run /app/app.py --server.address=0.0.0.0 --server.port=8501"
    depends_on:
      - etl
    networks:
      - plant-net
    logging: *default-logging
