# Mosquitto MQTT broker configuration
# Smart Plant Monitoring - VPS layer

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Default MQTT listener
listener 1883
protocol mqtt

# WebSocket listener (for browser/dashboard clients)
listener 9001
protocol websockets

# NOTE: anonymous access is enabled for local development.
# For production, disable it and configure password_file / ACLs.
allow_anonymous true
