default_environment: default
environments:
    default:
        connections:
            google_cloud_platform:
                - name: gcp-default
                  project_id: your-gcp-project
                  service_account_file: /path/to/gcp-secrets.json
            duckdb:
                - name: duckdb-sensor
                  path: /path/to/duckdb
                - name: duckdb-image
                  path: /path/to/duckdb
                - name: duckdb-weather
                  path: /path/to/duckdb
