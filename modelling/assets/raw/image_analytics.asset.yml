name: raw.image_analytics
type: duckdb.sql
connection: duckdb-image

columns:
  - name: filename
    type: string
  - name: plant_type
    type: string
  - name: health_status
    type: string
  - name: confidence
    type: float
  - name: severity
    type: float
  - name: summary
    type: string
  - name: possible_issues
    type: string[]
  - name: recommendations
    type: string[]
  - name: pixel_location
    type: integer[][]
  - name: event_time
    type: timestamp
