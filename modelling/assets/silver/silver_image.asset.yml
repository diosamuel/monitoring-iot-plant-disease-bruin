name: silver.image
type: ingestr
connection: gcp-default

depends:
  - silver_duck.image

parameters:
  source_connection: duckdb-image
  source_table: silver_duck.image
  destination: bigquery
  incremental_strategy: replace

columns:
  - name: filename
    type: STRING
    description: image filename (primary key)
    checks:
      - name: not_null
      - name: unique
  - name: event_time
    type: TIMESTAMP
    description: timestamp when the image was captured
    checks:
      - name: not_null
  - name: plant_type
    type: STRING
    description: detected plant species
  - name: health_status
    type: STRING
    description: health classification
    checks:
      - name: accepted_values
        value:
          - healthy
          - diseased
          - unknown
  - name: confidence
    type: FLOAT64
    description: model confidence score (0.0 to 1.0)
  - name: severity
    type: FLOAT64
    description: disease severity percentage
  - name: summary
    type: STRING
    description: AI-generated summary of plant condition
  - name: possible_issues
    type: STRING
    description: JSON array of possible issues
  - name: recommendations
    type: STRING
    description: JSON array of recommendations
  - name: heatmap
    type: STRING
    description: JSON array of [x, y] pixel coordinates
