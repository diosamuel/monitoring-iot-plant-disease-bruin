name: silver.sensor
type: ingestr
connection: gcp-default

depends:
  - silver_duck.sensor

parameters:
  source_connection: duckdb-sensor
  source_table: silver_duck.sensor
  destination: bigquery
  incremental_strategy: replace

columns:
  - name: filename
    type: STRING
    description: image filename associated with this sensor reading
    checks:
      - name: not_null
  - name: event_time
    type: TIMESTAMP
    description: timestamp of the sensor reading
    checks:
      - name: not_null
  - name: temperature
    type: FLOAT64
    description: temperature in Celsius
  - name: humidity
    type: FLOAT64
    description: relative humidity percentage
  - name: soil_moisture
    type: FLOAT64
    description: soil moisture raw ADC value
